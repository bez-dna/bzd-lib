[package]
name = "bzd-lib"
edition = "2024"

[dependencies]
anyhow = "1.0.104"

config = { version = "0.15.25", default-features = false, features = ["toml"] }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

tracing = "0.1.44"
tracing-subscriber = "0.3.23"

tonic = "0.14.6"
prost = "0.14.4"
prost-types = "0.14.4"

strum = "0.28.0"
strum_macros = "0.28.0"

chrono = { version = "0.4.45", default-features = false, features = [
  "now",
  "serde",
] }
uuid = { version = "1.26.0", features = ["v7"] }

[build-dependencies]
tonic-prost-build = "0.14.6"
